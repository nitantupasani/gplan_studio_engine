# Wind load data. Read through GPLAN.structural.codes.is875 (part3_*).
# Clause numbers follow the 2015 edition; the transcribed values that the
# loads-analysis spec did not itself vet carry verify: "print".
source: "IS 875 (Part 3) : 2015, Cl 6.2 (design wind speed), Cl 6.3 (design wind pressure), Table 2 (terrain and height factor k2), Table 4 (area averaging factor Ka), Table 5 (Cpe for walls), Table 6 (Cpe for pitched roofs), Cl 7.3.2 (internal pressure coefficients)"
edition: "2015"
units:
  speed: "m/s"
  pressure: "kPa"
  height: "m"
  area: "m2"
  angle: "deg"

# Cl 5.2 / Fig. 1: six basic wind speed zones on the map of India.
basic_wind_speed:
  source: "IS 875 (Part 3) : 2015, Cl 5.2 and Fig. 1, basic wind speed map of India"
  zones:
    "1": 33.0
    "2": 39.0
    "3": 44.0
    "4": 47.0
    "5": 50.0
    "6": 55.0
  # Annex A city list, a working subset for the UI. Values are m/s.
  # Checked 2026-08-30 against Appendix A of IS 875 (Part 3):1987, whose city
  # list the 2015 Annex A carries forward. 28 of the 29 entries below agree
  # with it exactly, under the older city names where they differ (Ahmadabad,
  # Bangalore, Bombay, Calcutta, Gauhati, Madras, Trivandrum, Vijaywada). The
  # exception is `indore`, which is not in the 1987 Appendix A at all; its 39.0
  # is unverified. The block stays flagged because the declared 2015 edition
  # could not be obtained, only the 1987 one.
  cities:
    source: "IS 875 (Part 3) : 2015, Annex A, basic wind speeds at 10 m height for some Indian cities and towns"
    verify: "print"
    values:
      agra: 47.0
      ahmedabad: 39.0
      amritsar: 47.0
      bengaluru: 33.0
      bhopal: 39.0
      bhubaneshwar: 50.0
      chandigarh: 47.0
      chennai: 50.0
      coimbatore: 39.0
      delhi: 47.0
      guwahati: 50.0
      hyderabad: 44.0
      indore: 39.0
      jaipur: 47.0
      kanpur: 47.0
      kolkata: 50.0
      lucknow: 47.0
      mumbai: 44.0
      nagpur: 44.0
      patna: 47.0
      pune: 39.0
      raipur: 39.0
      ranchi: 39.0
      surat: 44.0
      thiruvananthapuram: 39.0
      vadodara: 44.0
      varanasi: 47.0
      vijayawada: 50.0
      visakhapatnam: 50.0

# Table 2: terrain, height and structure size factor k2, bilinear on
# (terrain category, height). Only the 10 m row is vetted by the spec.
# Checked 2026-08-30 and NOT settled. The 2015 edition is not publicly
# available, and the 1987 edition cannot stand in for it here: its Table 2 has
# a third axis, structure class A, B and C, that the 2015 revision removed, so
# the 1987 grid is not the same shape as the one below. The same applies to
# cpe_walls and cpe_pitched_roof. All three stay flagged.
k2:
  source: "IS 875 (Part 3) : 2015, Cl 6.3.2.2, Table 2, k2 factors for terrain categories 1 to 4"
  verify: "print"
  vetted: "the 10 m row (1.05 / 1.00 / 0.91 / 0.80) is the value set vetted in the loads spec; the rest of the grid is a transcription to check against the print"
  categories: [1, 2, 3, 4]
  heights_m: [10, 15, 20, 30, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500]
  grid:
    - [1.05, 1.09, 1.12, 1.15, 1.20, 1.26, 1.30, 1.32, 1.34, 1.35, 1.37, 1.38, 1.39, 1.40]
    - [1.00, 1.05, 1.07, 1.12, 1.17, 1.24, 1.28, 1.30, 1.32, 1.34, 1.36, 1.37, 1.38, 1.39]
    - [0.91, 0.97, 1.01, 1.06, 1.12, 1.20, 1.24, 1.27, 1.29, 1.31, 1.33, 1.34, 1.35, 1.36]
    - [0.80, 0.80, 0.80, 0.97, 1.10, 1.20, 1.24, 1.27, 1.28, 1.30, 1.31, 1.32, 1.33, 1.34]
  below_table: "heights under the first tabulated height take the 10 m row, the conservative standard reading; part3_k2_range reports it"

# Cl 6.3: design wind pressure pd = Kd Ka Kc pz. All three default OFF
# (taken as 1.0) in v1; the wind module turns them on explicitly.
factors:
  kd:
    value: 0.9
    source: "IS 875 (Part 3) : 2015, Cl 6.3.1, wind directionality factor for rectangular clad buildings"
    default_applied: false
  kc:
    value: 0.9
    source: "IS 875 (Part 3) : 2015, Cl 6.3.3, combination factor for frames with a full set of pressure coefficients"
    default_applied: false
  ka:
    source: "IS 875 (Part 3) : 2015, Cl 6.3.2, Table 4, area averaging factor, linear interpolation between tabulated areas"
    default_applied: false
    areas_m2: [10.0, 25.0, 100.0]
    values: [1.0, 0.9, 0.8]

# Table 5: external pressure coefficients for the walls of a rectangular clad
# building. Here l is always the greater plan dimension and w is always the
# lesser plan dimension. At theta = 0, A is windward and B is leeward; at
# theta = 90, C is windward and D is leeward. Bands, not interpolation.
#
# Printed values checked 2026-08-31 against IITK-GSDMA Wind02 V5.0, Table 5,
# printed pages 41-42:
# https://www.iitk.ac.in/nicee/IITK-GSDMA/W02.pdf
# Independently corroborated by the BIS-hosted March 2025 NBC draft, Table 8:
# https://www.services.bis.gov.in/tmp/WCCED21426932_12032025_1.pdf
cpe_walls:
  source: "IS 875 (Part 3) : 2015, Table 5, external pressure coefficients Cpe for walls of rectangular clad buildings, wind angles 0 and 90 deg"
  verify: "print"
  verification: "print-verified 2026-08-31 against IITK-GSDMA Wind02 V5.0 Table 5; independently corroborated by BIS draft CED 46 (26932) WC Table 8"
  dimensions: "l is the greater plan dimension; w is the lesser plan dimension"
  rows:
    - h_over_w_max: 0.5
      l_over_w_max: 1.5
      windward: 0.7
      leeward: -0.2
      side: -0.5
      theta_90:
        windward: 0.7
        leeward: -0.2
        side: -0.5
    - h_over_w_max: 0.5
      l_over_w_max: 4.0
      windward: 0.7
      leeward: -0.25
      side: -0.6
      theta_90:
        windward: 0.7
        leeward: -0.1
        side: -0.5
    - h_over_w_max: 1.5
      l_over_w_max: 1.5
      windward: 0.7
      leeward: -0.25
      side: -0.6
      theta_90:
        windward: 0.7
        leeward: -0.25
        side: -0.6
    - h_over_w_max: 1.5
      l_over_w_max: 4.0
      windward: 0.7
      leeward: -0.3
      side: -0.7
      theta_90:
        windward: 0.7
        leeward: -0.1
        side: -0.5
    - h_over_w_max: 6.0
      l_over_w_max: 1.5
      windward: 0.8
      leeward: -0.25
      side: -0.8
      theta_90:
        windward: 0.8
        leeward: -0.25
        side: -0.8
    - h_over_w_max: 6.0
      l_over_w_max: 4.0
      windward: 0.7
      leeward: -0.4
      side: -0.7
      theta_90:
        windward: 0.8
        leeward: -0.1
        side: -0.5

# Table 6: external pressure coefficients for pitched roofs, wind angle 0 deg,
# windward slope EF and leeward slope GH. Band on h/w, linear on roof angle.
cpe_pitched_roof:
  source: "IS 875 (Part 3) : 2015, Table 6, external pressure coefficients Cpe for pitched roofs of rectangular clad buildings, wind angle 0 deg"
  verify: "print"
  note: "the loads spec vets no numbers here; every band is a transcription to check against the print"
  bands:
    - h_over_w_max: 0.5
      angles_deg: [0.0, 5.0, 10.0, 20.0, 30.0, 45.0, 60.0]
      windward: [-0.8, -0.9, -1.2, -0.4, 0.0, 0.3, 0.7]
      leeward: [-0.4, -0.4, -0.4, -0.4, -0.4, -0.5, -0.6]
    - h_over_w_max: 1.5
      angles_deg: [0.0, 5.0, 10.0, 20.0, 30.0, 45.0, 60.0]
      windward: [-0.8, -0.9, -1.1, -0.7, -0.2, 0.2, 0.6]
      leeward: [-0.6, -0.6, -0.6, -0.5, -0.5, -0.5, -0.5]
    - h_over_w_max: 6.0
      angles_deg: [0.0, 5.0, 10.0, 20.0, 30.0, 45.0, 60.0]
      windward: [-0.7, -0.7, -0.7, -0.8, -1.0, -0.2, 0.2]
      leeward: [-0.6, -0.6, -0.6, -0.6, -0.5, -0.5, -0.5]

# Cl 7.3.2: internal pressure coefficients by wall permeability. Each entry is
# the magnitude; the coefficient acts as plus and minus that magnitude.
cpi:
  source: "IS 875 (Part 3) : 2015, Cl 7.3.2, internal pressure coefficients by degree of permeability of the walls"
  normal:
    magnitude: 0.2
    source: "Cl 7.3.2.1, buildings with low permeability, openings up to about 5 percent of the wall area"
  medium:
    magnitude: 0.5
    source: "Cl 7.3.2.2, buildings with medium permeability, openings between about 5 and 20 percent of the wall area"
  large:
    magnitude: 0.7
    source: "Cl 7.3.2.3, buildings with large permeability, openings above about 20 percent of the wall area"

# Validity gates for the static method used by loads/wind.py.
static_method_limits:
  max_height_m: 20.0
  max_height_over_least_width: 5.0
  max_depth_over_breadth_or_height_for_no_friction: 4.0
  # Compatibility key for codes.is875.part3_static_limits(). wind.py uses the
  # complete d/b-or-d/h name above.
  max_plan_aspect_for_no_friction: 4.0
  source: "IS 875 (Part 3) : 2015, Cl 10.1 dynamic effects gate and Cl 7.4.1 frictional drag gate; the engine warns rather than refuses"
