# Indian hot-rolled section database, read by design/steel/sections.py.
#
# EVERY entry carries verify: "print". The values are the SP 6(1) handbook
# properties as commonly published; none of them has been checked against a
# printed copy of SP 6(1) or IS 808 in this repository, so a section must be
# verified against the handbook before it goes into a built member. The loader
# cross-checks the internally consistent relations (Zex = Ixx / (h/2),
# r = sqrt(I/A), mass = 7.85 g/cm3 x A) in the test battery, which catches
# transcription slips but cannot invent the handbook.
#
# Plastic moduli are NOT in SP 6(1). Where zp_computed is true, zpx_cm3 is the
# blanket estimate 1.12 x Zex, which sits below the true shape factor of a
# rolled I-section (about 1.14 to 1.15), so bending capacity from it is on the
# safe side. A verified Zp replaces the estimate by setting zp_computed: false.
#
# Angles: rx_cm and ry_cm are about the GEOMETRIC axes. Compression capacity of
# an angle strut is governed by the minor principal axis, so use rvv_cm; a
# strut check that reads ry_cm for an angle is wrong.
schema_version: 1
source: "SP 6(1):1964 Handbook for Structural Engineers Part 1 (rolled steel sections), designations per IS 808:1989"
edition: "SP 6(1):1964; IS 808:1989 (reaffirmed 2004)"

units:
  mass: kg/m
  dimension: mm
  area: cm2
  second_moment: cm4
  section_modulus: cm3
  radius_of_gyration: cm

zp_estimate_factor: 1.12
zp_estimate_note: "zpx = 1.12 x zex where zp_computed is true; SP 6(1) does not tabulate plastic moduli"

# Keyed by IS 808 designation. The family is the leading token of the key.
