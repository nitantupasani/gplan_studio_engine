fig_5_mf_compression:
  source: "IS 456:2000 Fig. 5, modification factor for compression reinforcement (Clause 23.2.1 e); breakpoints digitized between the plotted end anchors 1.00 at pc = 0 and 1.50 at pc = 3.0"
  edition: "2000"
  units: "dimensionless; pc in percent"
  verify: "print"
  mf_min: 1.00
  mf_max: 1.50
  pc: [0.00, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.50, 3.00]
  mf: [1.000, 1.090, 1.160, 1.220, 1.270, 1.310, 1.350, 1.380, 1.410, 1.460, 1.500]

fig_6_mf_flanged:
