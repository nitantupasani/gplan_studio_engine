# IS 456:2000 Figures 4, 5 and 6 as breakpoint grids for codes/is456.py.
#
# The figures are curves; this file is their digitization and is the ground
# truth the callables interpolate. Every grid carries `verify: "print"`: the
# numbers must be read back against the printed figures before the output of
# this engine is used for anything but a preliminary scheme.
#
# Interpolation is linear (bilinear for Fig 4) between listed breakpoints and
# flat outside the listed range, which is what the printed curves show at their
# axis limits.
source: "IS 456:2000, Plain and Reinforced Concrete - Code of Practice, Figures 4, 5 and 6 (Clause 23.2.1)"
edition: "2000, reaffirmed 2021"

fig_4_mf_tension:
  source: "IS 456:2000 Fig. 4, modification factor for tension reinforcement (Clause 23.2.1 d); grid generated from the published curve fit mf = 1 / (0.225 + 0.00322 fs - 0.625 log10(1/pt)) and clipped to the plotted axis range 0.80 to 2.00"
  edition: "2000"
  units: "dimensionless; fs in N/mm2, pt in percent"
  verify: "print"
  mf_min: 0.80
  mf_max: 2.00
  pt: [0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 1.00, 1.20, 1.40, 1.60, 1.80, 2.00, 2.50, 3.00]
  fs_mpa: [120, 145, 165, 190, 215, 240, 265, 290]
  mf:
    120: [2.000, 2.000, 2.000, 2.000, 2.000, 2.000, 2.000, 2.000, 1.943, 1.815, 1.636, 1.513, 1.423, 1.353, 1.297, 1.251, 1.163, 1.099]
    145: [2.000, 2.000, 2.000, 2.000, 2.000, 2.000, 1.985, 1.808, 1.680, 1.584, 1.445, 1.349, 1.277, 1.220, 1.174, 1.136, 1.063, 1.010]
    165: [2.000, 2.000, 2.000, 2.000, 2.000, 1.970, 1.760, 1.619, 1.516, 1.437, 1.322, 1.241, 1.180, 1.131, 1.092, 1.059, 0.995, 0.948]
    190: [2.000, 2.000, 2.000, 2.000, 1.961, 1.700, 1.542, 1.432, 1.351, 1.288, 1.195, 1.128, 1.077, 1.037, 1.004, 0.976, 0.921, 0.881]
    215: [2.000, 2.000, 2.000, 1.848, 1.693, 1.496, 1.371, 1.284, 1.219, 1.167, 1.090, 1.034, 0.991, 0.957, 0.929, 0.905, 0.858, 0.823]
    240: [2.000, 2.000, 1.783, 1.609, 1.490, 1.335, 1.235, 1.164, 1.110, 1.067, 1.002, 0.955, 0.918, 0.889, 0.864, 0.843, 0.802, 0.800]
