# IS 456:2000 tabulated data backing codes/is456.py.
#
# Every block carries its own `source:` (document + table/clause) and `edition:`.
# `verify: "print"` marks a block transcribed from the printed standard or a
# design aid rather than computed from a formula given in this repository: those
# numbers are vetted defaults and must be read back against the print before the
# output of this engine is used for anything but a preliminary scheme.
#
# Units: cover and spacing mm, stresses N/mm2 (MPa), grades as fck in MPa.
source: "IS 456:2000, Plain and Reinforced Concrete - Code of Practice"
edition: "2000, reaffirmed 2021, incorporating Amendments 1 to 6"

table_5_min_grade:
  source: "IS 456:2000 Table 5, minimum cement content, maximum w/c ratio and minimum grade of concrete for different exposures (reinforced concrete column)"
  edition: "2000"
  units: "fck MPa"
  values:
    mild: 20
    moderate: 25
    severe: 30
    very_severe: 35
    extreme: 40

table_16_nominal_cover:
  source: "IS 456:2000 Table 16, nominal cover to meet durability requirements"
  edition: "2000"
  units: "mm"
  values:
    mild: 20
    moderate: 30
    severe: 45
    very_severe: 50
    extreme: 75

table_16a_fire_cover:
  source: "IS 456:2000 Table 16A (Clauses 21.4 and 26.4.3 and Fig. 1), nominal cover to meet specified period of fire resistance"
  edition: "2000"
  units: "mm"
  # All 42 cells read against the print 2026-08-30. The printed table also
  # carries a bold line below which the case needs the anti spalling measures
  # of Cl 21.3.1; that line is not encoded.
  verify: "verified 2026-08-30 against IS 456:2000 Table 16A, law.resource.org BIS scan is.456.2000"
  ratings_h: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
  members:
    beam_simply_supported: [20, 20, 20, 40, 60, 70]
    beam_continuous: [20, 20, 20, 30, 40, 50]
    slab_simply_supported: [20, 20, 25, 35, 45, 55]
    slab_continuous: [20, 20, 20, 25, 35, 45]
    rib_simply_supported: [20, 20, 35, 45, 55, 65]
    rib_continuous: [20, 20, 20, 35, 45, 55]
    column: [40, 40, 40, 40, 40, 40]
  # Bare member words resolve to the simply supported (larger cover) row.
  aliases:
    beam: beam_simply_supported
    slab: slab_simply_supported
    rib: rib_simply_supported
    footing: column

table_15_clear_spacing:
  source: "IS 456:2000 Table 15 (Clause 26.3.3), clear distance between bars"
  edition: "2000"
  units: "mm"
  # All 15 cells read against the print 2026-08-30.
  verify: "verified 2026-08-30 against IS 456:2000 Table 15, law.resource.org BIS scan is.456.2000"
  redistribution_pct: [-30, -15, 0, 15, 30]
  values:
    250: [215, 260, 300, 300, 300]
    415: [125, 155, 180, 210, 235]
    500: [105, 130, 150, 175, 195]

table_12_moment_coefficients:
  # Carried here for the one-way continuous slab and beam path (Clause 22.5.1).
  # No clause callable in is456.py reads it yet; slabs.py is its consumer.
  source: "IS 456:2000 Table 12, bending moment coefficients for continuous beams and one-way slabs"
  edition: "2000"
  units: "coefficient on w l^2, l = effective span"
  # All eight coefficients read against the print 2026-08-30. Cl 22.5.1 names
  # Table 12 for moments and Table 13 for shear; Table 13 is not carried here.
  verify: "verified 2026-08-30 against IS 456:2000 Table 12, law.resource.org BIS scan is.456.2000"
  applicability: "three or more approximately equal spans (within 15 percent), uniformly distributed load, imposed load not exceeding dead load (Clause 22.5.1)"
  dead_and_imposed_fixed:
    span_end: 0.0833333333    # +1/12, near middle of end span
    span_interior: 0.0625     # +1/16, middle of interior spans
    support_near_end: -0.10   # -1/10, at support next to the end support
    support_interior: -0.0833333333  # -1/12, at other interior supports
  imposed_not_fixed:
    span_end: 0.10            # +1/10
    span_interior: 0.0833333333  # +1/12
    support_near_end: -0.1111111111  # -1/9
    support_interior: -0.1111111111  # -1/9

table_19_tau_c:
  source: "IS 456:2000 Table 19, design shear strength of concrete tau_c; the closed form in codes/is456.py is the SP 24 fit reproduced by table_19__tau_c"
  edition: "2000"
  units: "N/mm2"
  # All 78 printed values read against the print 2026-08-30, six grade columns
  # by thirteen pt rows. The closed form beside them is unchanged.
  verify: "verified 2026-08-30 against IS 456:2000 Table 19, law.resource.org BIS scan is.456.2000"
  closed_form: "beta = max(0.8 fck / (6.89 pt), 1.0); tau_c = 0.85 sqrt(0.8 fck) (sqrt(1 + 5 beta) - 1) / (6 beta)"
  pt_min: 0.15
  pt_max: 3.00
  fck_min: 15
  fck_max: 40
  # Printed grid, used as test vectors against the closed form (tolerance 3 percent).
  pt: [0.15, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00]
  grades:
    15: [0.28, 0.35, 0.46, 0.54, 0.60, 0.64, 0.68, 0.71, 0.71, 0.71, 0.71, 0.71, 0.71]
    20: [0.28, 0.36, 0.48, 0.56, 0.62, 0.67, 0.72, 0.75, 0.79, 0.81, 0.82, 0.82, 0.82]
    25: [0.29, 0.36, 0.49, 0.57, 0.64, 0.70, 0.74, 0.78, 0.82, 0.85, 0.88, 0.90, 0.92]
    30: [0.29, 0.37, 0.50, 0.59, 0.66, 0.71, 0.76, 0.80, 0.84, 0.88, 0.91, 0.94, 0.96]
    35: [0.29, 0.37, 0.50, 0.59, 0.67, 0.73, 0.78, 0.82, 0.86, 0.90, 0.93, 0.96, 0.99]
    40: [0.30, 0.38, 0.51, 0.60, 0.68, 0.74, 0.79, 0.84, 0.88, 0.92, 0.95, 0.98, 1.01]

table_20_tau_c_max:
  source: "IS 456:2000 Table 20, maximum shear stress tau_c_max"
  edition: "2000"
  units: "N/mm2"
  grades: [15, 20, 25, 30, 35, 40]
  values: [2.5, 2.8, 3.1, 3.5, 3.7, 4.0]
  note: "M40 and above take the M40 value"

tau_bd:
  source: "IS 456:2000 Clause 26.2.1.1, design bond stress for plain bars in tension"
  edition: "2000"
  units: "N/mm2"
  grades: [15, 20, 25, 30, 35, 40]
  values: [1.0, 1.2, 1.4, 1.5, 1.7, 1.9]
  deformed_factor: 1.6
  compression_factor: 1.25
  note: "M40 and above take the M40 value; factors are Clause 26.2.1.1 increases for deformed bars in tension and for bars in compression"

k_solid_slab:
  source: "IS 456:2000 Clause 40.2.1.1, shear strength enhancement factor k for solid slabs"
  edition: "2000"
  units: "dimensionless"
  overall_depth_mm: [150, 175, 200, 225, 250, 275, 300]
  values: [1.30, 1.25, 1.20, 1.15, 1.10, 1.05, 1.00]

sp16_table_f_fsc:
  source: "SP 16:1980 Table F, stress in compression reinforcement fsc for doubly reinforced sections, d'/d as tabulated; Fe 550 row derived from the IS 456 Clause 38.1 design stress-strain curve because SP 16 does not tabulate it"
  edition: "SP 16:1980 (design aid to IS 456)"
  units: "N/mm2"
  verify: "print"
  dprime_over_d: [0.05, 0.10, 0.15, 0.20]
  values:
    250: [217.0, 217.0, 217.0, 217.0]
    415: [355.0, 353.0, 342.0, 329.0]
    500: [412.0, 412.0, 395.0, 370.0]
    550: [459.0, 442.0, 420.0, 384.0]

annex_d_table_26:
  source: "IS 456:2000 Table 26, bending moment coefficients for rectangular panels supported on four sides with provision for torsion at corners (Annex D-1.1)"
  edition: "2000"
  units: "coefficient alpha on w lx^2, lx = shorter span"
  # All nine cases read against the print 2026-08-30: both short span rows for
  # each of the eight ly/lx columns, the long span coefficients, and every
  # printed dash reproduced as null.
  verify: "verified 2026-08-30 against IS 456:2000 Table 26, law.resource.org BIS scan is.456.2000"
  ratios: [1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.75, 2.0]
  # alpha_y_neg / alpha_y_pos are constant for all ly/lx.
  # null means the edge is discontinuous in that direction, so no negative
  # moment coefficient is tabulated; the callable returns 0.0 there.
  cases:
    1:
      name: interior
      alpha_x_neg: [0.032, 0.037, 0.043, 0.047, 0.051, 0.053, 0.060, 0.065]
      alpha_x_pos: [0.024, 0.028, 0.032, 0.036, 0.039, 0.041, 0.045, 0.049]
      alpha_y_neg: 0.032
      alpha_y_pos: 0.024
    2:
      name: one_short_edge_discontinuous
      alpha_x_neg: [0.037, 0.043, 0.048, 0.051, 0.055, 0.057, 0.064, 0.068]
      alpha_x_pos: [0.028, 0.032, 0.036, 0.039, 0.041, 0.044, 0.048, 0.052]
      alpha_y_neg: 0.037
      alpha_y_pos: 0.028
    3:
      name: one_long_edge_discontinuous
      alpha_x_neg: [0.037, 0.044, 0.052, 0.057, 0.063, 0.067, 0.077, 0.085]
      alpha_x_pos: [0.028, 0.033, 0.039, 0.044, 0.047, 0.051, 0.059, 0.065]
      alpha_y_neg: 0.037
      alpha_y_pos: 0.028
    4:
      name: two_adjacent_edges_discontinuous
      alpha_x_neg: [0.047, 0.053, 0.060, 0.065, 0.071, 0.075, 0.084, 0.091]
      alpha_x_pos: [0.035, 0.040, 0.045, 0.049, 0.053, 0.056, 0.063, 0.069]
      alpha_y_neg: 0.047
      alpha_y_pos: 0.035
    5:
      name: two_short_edges_discontinuous
      alpha_x_neg: [0.045, 0.049, 0.052, 0.056, 0.059, 0.060, 0.065, 0.069]
      alpha_x_pos: [0.035, 0.037, 0.040, 0.043, 0.044, 0.045, 0.049, 0.052]
      alpha_y_neg: null
      alpha_y_pos: 0.035
    6:
      name: two_long_edges_discontinuous
      alpha_x_neg: [null, null, null, null, null, null, null, null]
      alpha_x_pos: [0.035, 0.043, 0.051, 0.057, 0.063, 0.068, 0.080, 0.088]
      alpha_y_neg: 0.045
      alpha_y_pos: 0.035
    7:
      name: three_edges_discontinuous_one_long_continuous
      alpha_x_neg: [0.057, 0.064, 0.071, 0.076, 0.080, 0.084, 0.091, 0.097]
      alpha_x_pos: [0.043, 0.048, 0.053, 0.057, 0.060, 0.064, 0.069, 0.073]
      alpha_y_neg: null
      alpha_y_pos: 0.043
    8:
      name: three_edges_discontinuous_one_short_continuous
      alpha_x_neg: [null, null, null, null, null, null, null, null]
      alpha_x_pos: [0.043, 0.051, 0.059, 0.065, 0.071, 0.076, 0.087, 0.096]
      alpha_y_neg: 0.057
      alpha_y_pos: 0.043
    9:
      name: four_edges_discontinuous
      alpha_x_neg: [null, null, null, null, null, null, null, null]
      alpha_x_pos: [0.056, 0.064, 0.072, 0.079, 0.085, 0.089, 0.100, 0.107]
      alpha_y_neg: null
      alpha_y_pos: 0.056

